version: "3.9"

services:
  ap-platform:
    build: .
    container_name: ap_geospatial
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend:/app/frontend
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
